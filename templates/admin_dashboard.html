<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervia - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf6ff, #f5f9ff, #eef7f5);
            color: #243447;
        }
        .header {
            padding: 18px 45px;
            background: rgba(255,255,255,.92);
            border-bottom: 1px solid #dce8f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(50,80,100,.08);
        }
        .logo { font-size: 27px; font-weight: bold; color: #2878a8; }
        .admin-label { font-size: 14px; color: #607d8b; }
        .container { width: 90%; max-width: 1100px; margin: 55px auto; }
        .welcome { text-align: center; margin-bottom: 45px; }
        .welcome h1 { font-size: 34px; color: #245b78; margin-bottom: 10px; }
        .welcome p { color: #71828d; font-size: 16px; }
        .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; max-width: 900px; margin: auto; }
        .option-card {
            background: rgba(255,255,255,.95);
            border: 1px solid #dce9f2;
            border-radius: 18px;
            padding: 38px 32px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 8px 25px rgba(45,80,100,.08);
            transition: .25s ease;
        }
        .option-card:hover { transform: translateY(-6px); box-shadow: 0 14px 30px rgba(45,80,100,.14); }
        .icon {
            width: 65px; height: 65px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 22px;
        }
        .online-icon { background: #e3f4ff; }
        .offline-icon { background: #e8f6ed; }
        .option-card h2 { font-size: 23px; margin-bottom: 12px; color: #294f63; }
        .option-card p { font-size: 15px; line-height: 1.6; color: #71828d; margin-bottom: 25px; }
        .button { display: inline-block; padding: 11px 20px; border-radius: 9px; font-size: 14px; font-weight: bold; }
        .online-button { background: #dff2ff; color: #2475a2; }
        .offline-button { background: #e1f3e7; color: #34794d; }
        .footer { text-align: center; margin-top: 60px; padding: 20px; color: #8a9aa4; font-size: 13px; }
        @media (max-width: 750px) {
            .header { padding: 16px 22px; }
            .container { width: 92%; margin-top: 35px; }
            .welcome h1 { font-size: 28px; }
            .options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">Intervia</div>
    <div class="admin-label">Admin Dashboard</div>
</header>

<main class="container">
    <section class="welcome">
        <h1>Interview Scheduling Dashboard</h1>
        <p>Choose the type of interview scheduling you want to manage.</p>
    </section>

    <section class="options">
        <a href="{{ url_for('online_interview') }}" class="option-card">
            <div class="icon online-icon">💻</div>
            <h2>Online Interview Scheduling</h2>           
            <span class="button online-button">Open Online Scheduling</span>
        </a>

        <a href="{{ url_for('admin') }}" class="option-card">
            <div class="icon offline-icon">🏢</div>
            <h2>Offline Interview Scheduling</h2>
            
            <span class="button offline-button">Open Offline Scheduling</span>
        </a>
    </section>
</main>

<footer class="footer">
    Intervia – Interview Time Allocation System
</footer>

</body>
</html>
