<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewFlow - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 390px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
            color: #263238;
        }

        p {
            color: #607d8b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #26a69a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            margin-top: 15px;
            color: #d32f2f;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #546e7a;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>
        <p>Login to manage InterviewFlow</p>

        <form method="POST" action="{{ url_for('admin_login') }}">

            <input
                type="text"
                name="admin_id"
                placeholder="Admin ID"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <a class="back" href="{{ url_for('home') }}">← Back to Home</a>

    </div>

</body>
</html>
